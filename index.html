<!DOCTYPE html>
<html>
<head>
    <title>Document Insight App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Document Insight App</h1>

    <p>Paste your document text below:</p>

    <textarea id="documentText"
        placeholder="Enter your document text here..."></textarea>

    <br>

    <button onclick="analyzeDocument()">
        Analyze Document
    </button>

    <div id="result">
        Results will appear here.
    </div>

    <script>
        async function analyzeDocument() {

            const text = document.getElementById("documentText").value;

            const response = await fetch("http://127.0.0.1:8000/analyze", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            });

            const result = await response.json();

            document.getElementById("result").innerHTML = `
                <h3>Analysis Result</h3>
                <p><strong>Characters:</strong> ${result.characters}</p>
                <p><strong>Words:</strong> ${result.words}</p>
                <p><strong>Lines:</strong> ${result.lines}</p>
            `;
        }
    </script>

</body>
</html>
